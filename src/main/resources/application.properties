spring.application.name=fabric-ai-advisor-version1-2310


# SQLite Database Configuration

spring.datasource.url=${DATABASE_URL:jdbc:sqlite:./fabric.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

ai.main.provider=${AI_MODEL_PROVIDER:llamacpp}
ai.main.endpoint=${AI_MODEL_ENDPOINT:http://127.0.0.1:8081}
ai.main.model=${AI_MODEL_NAME:gemma-main}

ai.evaluation.provider=${EVAL_MODEL_PROVIDER:llamacpp}
ai.evaluation.endpoint=${EVAL_MODEL_ENDPOINT:http://127.0.0.1:8082}
ai.evaluation.model=${EVAL_MODEL_NAME:qwen-eval}
ai.models-file=${AI_MODELS_FILE:}
# Web Server
server.port=8080
